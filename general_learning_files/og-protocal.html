<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--These are some of the open graph(og) protocal tags/properties-->
    <meta property="og:title" content="page title with brief descriptio, summarise contrnt">
    <meta property="og:type" content="type of content being shared eg website, article, music etc">
    <meta property="og:description" content="brief page description with a few sentences with little detail">
    <meta property="og:url" content="the url link to the page">
    <meta property="og:image" content="the url of an image that represnts the page, could be a log, etc">
</head>

</body>
</html>
